<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Side Street Bedford — Your review</title>
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Rubik+Dirt&family=Allison&display=swap" rel="stylesheet">
<script src="config.js?v=1"></script>
<style>
  :root {
    --yellow: #feda4d;
    --yellow-dark: #f2c814;
    --black: #000000;
    --panel: #121212;
    --line: #2c2c2c;
    --text: #ffffff;
    --muted: #b9b9b9;
    --radius: 8px;
    --display: "Rubik Dirt", Impact, sans-serif;
    --script: "Allison", cursive;
    --body: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    overflow-x: clip;
    background: var(--black);
    color: var(--text);
    font: 500 19px/1.4 var(--body);
    display: flex;
    flex-direction: column;
  }
  header {
    position: relative;
    text-align: center;
    padding: 28px 16px 70px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.45) 55%, #000 100%),
      url("assets/hero.jpg") center 40% / cover no-repeat;
  }
  header img { width: min(230px, 64vw); height: auto; display: block; margin: 0 auto 10px; }
  .loc {
    font: 700 15px/1 var(--body);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--yellow);
  }
  .tag { font: 400 46px/1 var(--script); color: #fff; margin-top: 6px; }

  .ribbon {
    background: var(--yellow); color: var(--black);
    padding: 10px 0 8px;
    overflow: hidden; white-space: nowrap;
  }
  .ribbon div {
    display: inline-block; animation: mq 30s linear infinite;
    font: 700 17px var(--body); text-transform: uppercase; letter-spacing: .06em;
  }
  .ribbon span { margin: 0 14px; }
  @keyframes mq { to { transform: translateX(-50%); } }

  main {
    flex: 1;
    width: 100%; max-width: 460px;
    margin: -40px auto 0; padding: 0 16px 32px;
    position: relative;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 4px solid var(--yellow);
    border-radius: var(--radius);
    box-shadow: 0 14px 40px rgba(0,0,0,.6);
    padding: 28px 22px;
    text-align: center;
  }
  h1 {
    font: 400 32px/1.05 var(--display);
    text-transform: uppercase;
    margin: 0 0 10px;
    color: #fff;
  }
  h1 em { font-style: normal; color: var(--yellow); }
  h1:focus { outline: none; }
  p.sub { margin: 0 0 22px; color: var(--muted); }

  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 10px; }
  .star {
    background: none; border: 0; padding: 4px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease;
  }
  .star svg { width: 48px; height: 48px; display: block; }
  .star path { fill: #333; transition: fill .12s ease; }
  .star.on path { fill: var(--yellow); }
  .star:active { transform: scale(.9); }
  .star:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
  .hint { min-height: 1.5em; font: 700 18px/1.4 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--yellow); margin: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 52px; padding: 14px 18px;
    border-radius: var(--radius); border: 2px solid var(--yellow);
    background: var(--yellow); color: var(--black);
    font: 700 19px/1 var(--body); text-transform: uppercase; letter-spacing: .04em;
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { background: var(--yellow-dark); border-color: var(--yellow-dark); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .alt { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; }
  .alt p { margin: 0 0 10px; color: var(--muted); font-size: 17px; }
  .btn-outline { background: transparent; color: var(--yellow); border-color: var(--yellow); }
  .btn-outline:hover { background: var(--yellow); border-color: var(--yellow); color: var(--black); }

  form { text-align: left; margin-top: 6px; }
  label { display: block; font: 700 15px/1.3 var(--body); text-transform: uppercase; letter-spacing: .05em; color: #fff; margin: 16px 0 6px; }
  textarea, input[type=text], input[type=email], input[type=tel] {
    width: 100%; font: 500 18px/1.4 var(--body); color: #fff;
    border: 1.5px solid #3a3a3a; border-radius: var(--radius);
    padding: 12px 14px; background: #000;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--yellow); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row label { margin-top: 0; }
  .contact-head { margin-top: 18px; font-size: 16px; color: var(--muted); }
  .hp { position: absolute; left: -9999px; }
  .privacy { font-size: 14px; color: var(--muted); margin: 14px 0 18px; }
  .err { color: #ff6b6b; font-size: 16px; margin: 10px 0 0; min-height: 1em; }

  .big-icon { width: 72px; height: 72px; margin: 0 auto 12px; display: block; border-radius: 50%; }
  [hidden] { display: none !important; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  footer { text-align: center; font-size: 14px; color: var(--muted); padding: 14px 16px 24px; text-transform: uppercase; letter-spacing: .08em; }
  footer b { color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .ribbon div, .fade { animation: none; }
  }
  @media (max-width: 360px) {
    .star svg { width: 40px; height: 40px; }
    .row { grid-template-columns: 1fr; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<header>
  <img src="assets/logo.svg" alt="Side Street">
  <div class="loc" id="locName"></div>
  <div class="tag">#BigFoodBigFlavour</div>
</header>

<main>
  <!-- Step 1: rating -->
  <section class="card fade" id="stepRate">
    <h1 data-i18n-html="rateTitle"></h1>
    <p class="sub" data-i18n="rateSub"></p>
    <div class="stars" id="stars" role="radiogroup"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <!-- Step 2a: 4–5 stars -->
  <section class="card fade" id="stepGoogle" hidden>
    <img class="big-icon" src="assets/icon.png" alt="">
    <h1 data-i18n-html="googleTitle"></h1>
    <p class="sub" data-i18n="googleSub"></p>
    <a class="btn" id="googleBtn" href="#" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.66 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.68 3.7 14.55 2.75 12 2.75 6.9 2.75 2.75 6.9 2.75 12S6.9 21.25 12 21.25c5.34 0 8.88-3.75 8.88-9.04 0-.6-.07-1.06-.15-1.51z"/></svg>
      <span data-i18n="googleBtn"></span>
    </a>
  </section>

  <!-- Step 2b: 1–3 stars -->
  <section class="card fade" id="stepFeedback" hidden>
    <h1 data-i18n-html="fbTitle"></h1>
    <p class="sub" data-i18n="fbSub"></p>
    <form id="fbForm" novalidate>
      <label for="msg" data-i18n="fbMsg"></label>
      <textarea id="msg" name="message" required maxlength="3000"></textarea>

      <p class="contact-head" data-i18n="fbContact"></p>
      <div class="row">
        <div>
          <label for="name"><span data-i18n="fbName"></span></label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100">
        </div>
        <div>
          <label for="phone"><span data-i18n="fbPhone"></span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
        </div>
      </div>
      <label for="email"><span data-i18n="fbEmail"></span></label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="150">

      <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="privacy" data-i18n="privacy"></p>
      <button class="btn" type="submit" id="sendBtn"><span data-i18n="fbSend"></span></button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <div class="alt">
      <p data-i18n="altText"></p>
      <a class="btn btn-outline" id="altGoogle" href="#" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.66 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.68 3.7 14.55 2.75 12 2.75 6.9 2.75 2.75 6.9 2.75 12S6.9 21.25 12 21.25c5.34 0 8.88-3.75 8.88-9.04 0-.6-.07-1.06-.15-1.51z"/></svg>
        <span data-i18n="altBtn"></span>
      </a>
    </div>
  </section>

  <!-- Step 3: thanks for feedback -->
  <section class="card fade" id="stepThanks" hidden>
    <img class="big-icon" src="assets/icon.png" alt="">
    <h1 data-i18n-html="thanksTitle"></h1>
    <p class="sub" data-i18n="thanksSub"></p>
  </section>
</main>

<div class="ribbon" aria-hidden="true"><div id="ribbon"></div></div>
<footer><b>Side Street</b> · Stacked with swagger</footer>

<script>
(() => {
  const CFG = window.REVIEW_CONFIG;
  const T = {
    en: {
      ribbon: ["Stacked with swagger", "Smash burgers", "Nashville chicken", "American BBQ", "#BigFoodBigFlavour"],
      rateTitle: "How was your <em>Side Street</em>?",
      rateSub: "Tap the stars to rate your visit.",
      hints: ["", "Not great…", "Could be better", "Alright", "Proper good!", "Banging!"],
      googleTitle: "Cheers, that's <em>legendary</em>!",
      googleSub: "Mind sharing it on Google? It really helps us out.",
      googleBtn: "Leave a Google review",
      fbTitle: "Sorry, we <em>missed the mark</em>.",
      fbSub: "Tell us what went wrong. Your message goes straight to the owner, who personally reads every one.",
      fbMsg: "What happened?",
      fbContact: "Want us to get back to you? (optional)",
      fbName: "Name", fbPhone: "Phone", fbEmail: "Email",
      privacy: "Your details are only used to reply about this visit. They're sent to us by email via our provider Web3Forms and never sold.",
      altText: "Prefer to post publicly?",
      altBtn: "Leave a Google review",
      fbSend: "Send",
      sending: "Sending…",
      errEmpty: "Please write a few words before sending.",
      errEmail: "That email address doesn't look right.",
      errSend: "Sending failed. Check your connection and try again.",
      thanksTitle: "Thanks, <em>message received</em>.",
      thanksSub: "The team will read it. We hope to see you again soon so we can put it right.",
      starLabel: n => `${n} star${n > 1 ? "s" : ""}`,
      ratingGroup: "Rating from 1 to 5 stars",
      title: "Side Street Bedford — Your review",
    },
  };

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const locKey = CFG.locations[params.get("loc")] ? params.get("loc") : CFG.defaultLocation;
  const loc = CFG.locations[locKey];
  const googleUrl = loc.reviewUrl || "https://search.google.com/local/writereview?placeid=" + encodeURIComponent(loc.placeId);

  const lang = "en";
  let rating = 0;

  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></svg>';
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "star";
    b.dataset.n = n;
    b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", "false");
    b.innerHTML = STAR;
    b.addEventListener("mouseenter", () => paint(n));
    b.addEventListener("focus", () => paint(n));
    b.addEventListener("click", () => choose(n));
    $("stars").appendChild(b);
  }
  $("stars").addEventListener("mouseleave", () => paint(rating));

  function paint(n) {
    document.querySelectorAll(".star").forEach(s => s.classList.toggle("on", +s.dataset.n <= n));
    $("hint").textContent = T[lang].hints[n];
  }

  function show(id) {
    ["stepRate", "stepGoogle", "stepFeedback", "stepThanks"].forEach(s => $(s).hidden = s !== id);
    window.scrollTo({ top: 0, behavior: "smooth" });
    const h = $(id).querySelector("h1");
    h.tabIndex = -1;
    h.focus({ preventScroll: true });
  }

  function track(event, props) {
    // Hook for cookieless analytics (Plausible / Umami / Cloudflare). No-op if none is loaded.
    if (window.plausible) window.plausible(event, { props: { loc: locKey, ...props } });
  }

  function choose(n) {
    if (rating) return; // first tap wins; a second quick tap must not start a competing flow
    rating = n;
    paint(n);
    document.querySelectorAll(".star").forEach(s => s.setAttribute("aria-checked", String(+s.dataset.n === n)));
    track("rating", { stars: n });
    setTimeout(() => {
      if (n >= 4) {
        show("stepGoogle");
        // Brief thank-you, then go to Google. The button stays as a fallback if the redirect is blocked.
        setTimeout(() => { location.href = googleUrl; }, 1600);
      } else {
        history.pushState({ step: "feedback" }, "");
        show("stepFeedback");
      }
    }, 350);
  }

  // Back from the feedback form returns to the stars instead of leaving the page.
  window.addEventListener("popstate", () => {
    if ($("stepFeedback").hidden) return;
    rating = 0;
    paint(0);
    document.querySelectorAll(".star").forEach(s => s.setAttribute("aria-checked", "false"));
    show("stepRate");
  });

  $("fbForm").addEventListener("submit", async e => {
    e.preventDefault();
    const t = T[lang];
    const f = e.target;
    if (!f.message.value.trim()) { $("err").textContent = t.errEmpty; f.message.focus(); return; }
    if (!f.email.checkValidity()) { $("err").textContent = t.errEmail; f.email.focus(); return; }
    if (f.botcheck.checked) { show("stepThanks"); return; }

    $("err").textContent = "";
    $("sendBtn").disabled = true;
    $("sendBtn").firstElementChild.textContent = t.sending;
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined,
        body: JSON.stringify({
          access_key: CFG.web3formsKey,
          subject: `${"★".repeat(rating)}${"☆".repeat(5 - rating)} Side Street ${loc.name} — customer feedback`,
          from_name: "Side Street Reviews",
          restaurant: `Side Street ${loc.name}`,
          rating: `${rating}/5`,
          message: f.message.value.trim(),
          name: f.name.value.trim() || "—",
          phone: f.phone.value.trim() || "—",
          email: f.email.value.trim() || "—",
          botcheck: false,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message);
      track("feedback_sent", { stars: rating });
      show("stepThanks");
    } catch (err) {
      $("err").textContent = t.errSend;
      $("sendBtn").disabled = false;
      $("sendBtn").firstElementChild.textContent = t.fbSend;
    }
  });

  function applyLang() {
    const t = T[lang];
    document.documentElement.lang = "en-GB";
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);
    document.querySelectorAll(".star").forEach(s => s.setAttribute("aria-label", t.starLabel(+s.dataset.n)));
    $("stars").setAttribute("aria-label", t.ratingGroup);
    $("ribbon").innerHTML = Array(8).fill(t.ribbon.map(x => `<span>${x}</span>·`).join("")).join("");
    $("hint").textContent = t.hints[rating];
  }

  $("locName").textContent = loc.name;
  $("googleBtn").href = googleUrl;
  $("altGoogle").href = googleUrl;
  $("altGoogle").addEventListener("click", () => track("google_from_feedback", { stars: rating }));
  applyLang();
  track("scan");
})();
</script>
</body>
</html>
